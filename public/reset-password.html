<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 min-h-screen flex items-center justify-center p-6">
  <div class="bg-white rounded-2xl p-6 shadow-xl w-full max-w-md">
    <h1 class="text-xl font-bold text-slate-800 mb-4">Reset Your Password</h1>
    <input id="newPassword" type="password" placeholder="New password" class="w-full p-3 mb-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    <button id="resetBtn" class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">Reset Password</button>
    <p id="statusMsg" class="text-sm mt-3"></p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const statusMsg = document.getElementById('statusMsg');

    document.getElementById('resetBtn').addEventListener('click', async () => {
      const newPassword = document.getElementById('newPassword').value.trim();
      if (!newPassword) return;

      try {
        const response = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword })
        });
        const result = await response.json();

        if (response.ok) {
          statusMsg.textContent = 'Password updated! Redirecting to login...';
          statusMsg.className = 'text-sm mt-3 text-green-600';
          setTimeout(() => { window.location.href = '/'; }, 2000);
        } else {
          statusMsg.textContent = result.error || 'Something went wrong';
          statusMsg.className = 'text-sm mt-3 text-red-500';
        }
      } catch (err) {
        statusMsg.textContent = 'Network error';
        statusMsg.className = 'text-sm mt-3 text-red-500';
      }
    });
  </script>
</body>
</html>
