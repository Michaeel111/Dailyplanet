<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Planet Weather</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-500 via-indigo-500 to-purple-600 min-h-screen flex flex-col items-center p-6">

  <h1 class="text-4xl font-extrabold text-white mb-8 tracking-tight drop-shadow">☀️ Daily Planet</h1>

  <div id="authSection" class="w-full max-w-md mb-6 bg-white/90 backdrop-blur rounded-2xl p-5 shadow-xl">
    <div id="loggedOutView">
      <input id="authEmail" type="email" placeholder="Email" class="w-full p-3 mb-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <input id="authPassword" type="password" placeholder="Password" class="w-full p-3 mb-3 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      <p class="text-right text-sm mb-2">
  <a href="#" id="forgotPasswordLink" class="text-indigo-600 hover:underline">Forgot password?</a>
</p>
      <div class="flex gap-2">
        <button id="loginBtn" class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">Login</button>
        <button id="signupBtn" class="flex-1 bg-slate-700 text-white py-2.5 rounded-lg font-medium hover:bg-slate-800 transition">Sign Up</button>
      </div>
      <p id="authError" class="text-red-500 text-sm mt-2"></p>
    </div>

    <div id="loggedInView" class="hidden flex items-center justify-between">
      <p class="text-slate-700">Logged in as <span id="userEmail" class="font-semibold"></span></p>
      <div>
        <button id="upgradeBtn" class="text-sm bg-yellow-500 text-white px-3 py-1.5 rounded-lg hover:bg-yellow-600 transition">✨ Upgrade</button>
<span id="premiumBadge" class="hidden text-sm bg-purple-100 text-purple-700 px-3 py-1.5 rounded-lg font-medium">⭐ Premium</span>
        <button id="logoutBtn" class="text-sm text-red-600 hover:underline ml-2">Log out</button>
      </div>
    </div>
  </div>

  <div class="w-full max-w-md">
    <div class="flex gap-2">
      <input
        id="cityInput"
        type="text"
        placeholder="Search a city..."
        class="flex-1 p-3 rounded-xl border-0 shadow-lg focus:outline-none focus:ring-2 focus:ring-white"
      />
      <button
        id="searchBtn"
        class="bg-white text-indigo-600 font-semibold px-6 rounded-xl shadow-lg hover:bg-slate-100 transition"
      >
        Search
      </button>
    </div>

    <div id="weatherResult" class="mt-6"></div>
  </div>

  <div id="favoritesSection" class="w-full max-w-md mt-8">
    <h2 class="text-lg font-semibold text-white/90 mb-2">Your Favorites</h2>
    <div id="favoritesList" class="space-y-2"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
