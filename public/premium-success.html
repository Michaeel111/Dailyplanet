<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Verifying Payment...</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow text-center">
    <p id="statusMsg" class="text-lg text-slate-700">Verifying your payment...</p>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const reference = params.get('reference');
    const statusMsg = document.getElementById('statusMsg');

    async function verify() {
      if (!reference) {
        statusMsg.textContent = 'No payment reference found.';
        return;
      }

      try {
        const response = await fetch(`/api/payment/verify/${reference}`, {
          headers: { 'Authorization': `Bearer ${localStorage.getItem('token')}` }
        });
        const result = await response.json();

        if (result.success) {
          statusMsg.textContent = 'Payment successful! Redirecting...';
          setTimeout(() => { window.location.href = '/'; }, 2000);
        } else {
          statusMsg.textContent = 'Payment could not be verified.';
        }
      } catch (err) {
        statusMsg.textContent = 'Something went wrong verifying payment.';
      }
    }

    verify();
  </script>
</body>
</html>
